name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ✅ Node setup (VERY IMPORTANT)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ✅ Install dependencies
      - name: Install dependencies
        run: npm ci

      # ✅ Build (Vite → dist)
      - name: Build project
        run: npm run build

      # ✅ DEBUG (remove after first success)
      - name: Debug dist folder
        run: |
          echo "Root files:"
          ls -la
          echo "Dist files:"
          ls -la dist

      # ✅ Deploy
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STORIES_BY_TJ_E411A }}
          channelId: live
          projectId: stories-by-tj-e411a
